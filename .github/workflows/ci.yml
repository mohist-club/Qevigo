name: CI

# Runs the unit tests and builds the app on a macOS runner for every push, so
# changes can be checked without a local Mac. Needs no secrets: the app is
# ad-hoc signed, which is fine for trying it out but not for a release (users
# cannot auto-update to it and Accessibility will not carry over).
on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    # Pushes to this repo already run; only run pull_request for forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    # The app needs the macOS 27 SDK, which only this image's Xcode 27 has.
    # It is a public preview; switch to the macos-27 label once GitHub ships it.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The app uses APIs up to the macOS 27 SDK, which the image's default
      # Xcode may predate, so use the newest Xcode the image has.
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swift --version

      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Unit tests
        run: swift test

      - name: Build app (release, ad-hoc signed)
        run: ./scripts/build-app.sh

      # Renders the settings tabs and the full-screen app grid to PNGs so UI
      # changes can be looked at without a Mac. Never fails the build.
      - name: Screenshots
        continue-on-error: true
        env:
          QEVIGO_DATA_DIR: ${{ runner.temp }}/qevigo-data
        run: |
          APP=dist/Qevigo.app/Contents/MacOS/Qevigo
          OUT=dist/screenshots
          mkdir -p "$OUT"
          # perl's alarm survives exec, so a hung launch is killed after 60s.
          perl -e 'alarm 60; exec @ARGV' "$APP" --snapshot "$OUT" || true
          perl -e 'alarm 60; exec @ARGV' "$APP" --demo-launcher "$OUT/launcher.png" || true
          perl -e 'alarm 60; exec @ARGV' "$APP" --demo-launcher "$OUT/launcher-search.png" --query calc || true
          perl -e 'alarm 60; exec @ARGV' "$APP" --demo-launcher "$OUT/launcher-folder.png" --demo-folder || true
          perl -e 'alarm 60; exec @ARGV' "$APP" --demo-launcher "$OUT/launcher-folder-open.png" --demo-folder --open-folder || true
          ls -l "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.sha }}
          path: dist/screenshots
          retention-days: 14
          if-no-files-found: ignore

      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent dist/Qevigo.app dist/Qevigo-ci.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Qevigo-${{ github.sha }}
          path: dist/Qevigo-ci.zip
          retention-days: 14
